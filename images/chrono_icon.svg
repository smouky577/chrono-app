<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B323B"/>
      <stop offset="1" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F4F7"/>
      <stop offset="0.45" stop-color="#AEB6C1"/>
      <stop offset="1" stop-color="#5E6773"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- timing ticks (chronograph feel) -->
  <g stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="116" y1="390" x2="116" y2="408"/>
    <line x1="186" y1="390" x2="186" y2="408"/>
    <line x1="256" y1="384" x2="256" y2="412"/>
    <line x1="326" y1="390" x2="326" y2="408"/>
    <line x1="396" y1="390" x2="396" y2="408"/>
  </g>

  <!-- speed trails -->
  <g stroke="url(#trail)" stroke-linecap="round">
    <line x1="40" y1="214" x2="150" y2="214" stroke-width="10"/>
    <line x1="20" y1="256" x2="140" y2="256" stroke-width="12"/>
    <line x1="40" y1="298" x2="150" y2="298" stroke-width="10"/>
  </g>

  <!-- slug / diabolo pellet, pointing right -->
  <path d="M150 190 C190 200 225 212 245 214 L262 204 C262 204 280 196 300 196
           C350 196 392 226 392 256 C392 286 350 316 300 316
           C280 316 262 308 262 308 L245 298 C225 300 190 312 150 322
           Q138 256 150 190 Z" fill="url(#metal)"/>

  <!-- skirt cavity -->
  <ellipse cx="152" cy="256" rx="10" ry="52" fill="#3A424D"/>
  <!-- head ring -->
  <path d="M262 204 C268 240 268 272 262 308" fill="none" stroke="#5E6773" stroke-width="4" opacity="0.7"/>
  <!-- highlight -->
  <path d="M290 212 C330 210 366 230 376 250" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
</svg>
